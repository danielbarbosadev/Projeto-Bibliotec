<!DOCTYPE html>
<html lang="pt-Br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="./login.css">
    <link rel="shortcut icon" href="/imgs/Icone - Bibliotec.png" type="image/x-icon">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <title>Login Bibliotec</title>
</head>

<body>
    <header class="cabecalho">
        <img src="../imgs/Logo Horizontal - branca.svg" alt="Logo Horizontal Bibliotec">
        <nav class="navegacao">
            <a href="../home/home.html">Home</a>
        </nav>

        <a href="../home/home.html" class="btn-home"><i class="fa-solid fa-house fa-lg"></i></a>
    </header>
    <main class="main-login">
        <section class="conteudo">
            <div class="titulo-login">
                <img src="../imgs/Icone - Bibliotec.png" alt="Icone Bibliotec">
                <div class="txt-titulo">
                    <h1>Bem-vindo(a) à Biblio Tec</h1>
                    <p>Acesse sua conta para continuar</p>
                </div>
            </div>

            <div class="info-login">
                <div class="inputs">
                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" placeholder="email@alunosenai.com">
                    </div>
                    <div class="campo">
                        <label for="senha">Senha</label>
                        <div class="campo-senha">
                            <input type="password" id="senha" placeholder="********">
                            <button class="btn-olho" type="button"><img src="../imgs/icone-olho.svg" alt="icone de ocultar e mostrar senha"></button>
                        </div>
                </div>
                </div>

                <div class="botoes">
                    <button type="submit" class="btn-entrar botao">Entrar</button>
                    <button class="btn-entrar-google botao">
                        <img src="../imgs/icone-google.svg" alt="icone do Google">
                        <span>Entrar com Google</span>
                    </button>
                </div>
            </div>
        </section>
    </main>
    <script src="login.js"></script>
</body>

</html>
