<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="/styles/global.css">
    <link rel="shortcut icon" href="/imgs/Icone - Bibliotec.png" type="image/x-icon">
    <title>Login Bibliotec</title>
</head>
<body>
    <header class="cabecalho-login">
        <img src="/imgs/Logo Horizontal - branca.svg" alt="Logo Horizontal Bibliotec">
        <a href="/home/home.html">Home</a>      
    </header>
    <main class="main-login">
        <section class="section-login">
            <div class="title-login">
                <img src="/imgs/Icone - Bibliotec.png" alt="Icone Bibliotec">
                <h1>Bem-vindo(a) à Biblio Tec</h1>
                <p>Acesse sua conta para continuar</p>
            </div>
            <div class="section-info-login">
                <div class="input">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="email@alunosenai.com">
                </div>
                <div class="input">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="********">
                </div>
                <a href="" class="btn-login btn-entrar ">Entrar</a>
                
                <div class="btn-login btn-entrar-google">
                    <!-- todo: colocar icone do google aqui-->
                    <a href="">Continuar com Google</a>
                </div>
            </div>
        </section>
    </main>
    <footer class="rodape-login">

    </footer>
</body>
</html>
